name: Dashboard build
on:
  pull_request:
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/dashboard-check.yml"
jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
