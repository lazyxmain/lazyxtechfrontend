name: Backend typecheck
on:
  pull_request:
    paths:
      - "services/backend/**"
      - ".github/workflows/backend-check.yml"
jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
