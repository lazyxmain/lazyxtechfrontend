<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t d">
  <title id="t">LazyXTech poster: technology that solves real business problems</title>
  <desc id="d">Editorial poster with layered blocks, code brackets and a rising bar chart in black and lime.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#111" fill-opacity=".14"/>
    </pattern>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6F98A"/>
      <stop offset="1" stop-color="#B7EA52"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="1000" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect width="800" height="1000" fill="#F6F6F1"/>
    <rect width="800" height="1000" fill="url(#dots)"/>

    <!-- big lime sun -->
    <circle cx="640" cy="330" r="270" fill="url(#lime)"/>
    <circle cx="640" cy="330" r="270" fill="none" stroke="#111" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="640" cy="330" r="190" fill="none" stroke="#111" stroke-opacity=".1" stroke-width="2" stroke-dasharray="4 10"/>

    <!-- logo -->
    <rect x="56" y="56" width="64" height="64" rx="18" fill="#111"/>
    <text x="88" y="102" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">L</text>
    <circle cx="116" cy="62" r="9" fill="#C5F36B" stroke="#F6F6F1" stroke-width="4"/>
    <text x="138" y="98" font-size="30" font-weight="700" fill="#111" letter-spacing="-1">LazyXTech</text>
    <text x="744" y="96" font-size="15" font-weight="600" fill="#111" fill-opacity=".55" text-anchor="end" letter-spacing="3">BHOPAL · INDIA</text>

    <!-- layered stack -->
    <g transform="translate(120 250)">
      <rect x="0" y="150" width="400" height="190" rx="26" fill="#111" fill-opacity=".08" transform="rotate(-6 200 245)"/>
      <rect x="30" y="80" width="400" height="190" rx="26" fill="#fff" stroke="#111" stroke-opacity=".15" stroke-width="2" transform="rotate(-6 230 175)"/>
      <g transform="rotate(-6 260 110)">
        <rect x="60" y="10" width="400" height="190" rx="26" fill="#111"/>
        <circle cx="96" cy="44" r="6" fill="#ff5f57"/><circle cx="116" cy="44" r="6" fill="#febc2e"/><circle cx="136" cy="44" r="6" fill="#28c840"/>
        <!-- code brackets -->
        <text x="260" y="150" font-size="120" font-weight="700" fill="#C5F36B" text-anchor="middle" letter-spacing="-6">&lt;/&gt;</text>
        <rect x="92" y="72" width="70" height="8" rx="4" fill="#fff" fill-opacity=".35"/>
        <rect x="92" y="92" width="44" height="8" rx="4" fill="#fff" fill-opacity=".2"/>
        <rect x="92" y="172" width="120" height="8" rx="4" fill="#fff" fill-opacity=".2"/>
        <rect x="372" y="172" width="64" height="8" rx="4" fill="#C5F36B"/>
      </g>
    </g>

    <!-- rising bars -->
    <g transform="translate(590 440) scale(0.78)">
      <rect x="0" y="130" width="34" height="50" rx="8" fill="#111" fill-opacity=".85"/>
      <rect x="48" y="96" width="34" height="84" rx="8" fill="#111" fill-opacity=".85"/>
      <rect x="96" y="58" width="34" height="122" rx="8" fill="#111" fill-opacity=".85"/>
      <rect x="144" y="8" width="34" height="172" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
      <path d="M17 118 L65 84 L113 46 L161 -4" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
    </g>

    <!-- headline -->
    <g fill="#111" font-weight="700" letter-spacing="-3">
      <text x="56" y="670" font-size="64">Technology that</text>
      <text x="56" y="740" font-size="64">solves real</text>
      <text x="56" y="810" font-size="64">business problems.</text>
    </g>
    <rect x="56" y="824" width="300" height="12" rx="6" fill="#C5F36B"/>

    <!-- footer -->
    <line x1="56" y1="900" x2="744" y2="900" stroke="#111" stroke-opacity=".2" stroke-width="2"/>
    <g font-size="17" font-weight="600" fill="#111" letter-spacing="1.5">
      <text x="56" y="942">DESIGN</text>
      <text x="196" y="942">ENGINEERING</text>
      <text x="394" y="942">GROWTH</text>
    </g>
    <circle cx="176" cy="936" r="4" fill="#C5F36B" stroke="#111" stroke-width="1.5"/>
    <circle cx="374" cy="936" r="4" fill="#C5F36B" stroke="#111" stroke-width="1.5"/>
    <text x="744" y="942" font-size="17" font-weight="600" fill="#111" fill-opacity=".55" text-anchor="end" letter-spacing="1">lazyxtech</text>
  </g>
</svg>
